version: 2

models:
  - name: stg_customers
    columns:
      - name: tenant_id
        tests:
          - not_null
      - name: customer_id
        tests:
          - not_null

  - name: stg_products
    columns:
      - name: tenant_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null

  - name: stg_transactions
    columns:
      - name: tenant_id
        tests:
          - not_null
      - name: transaction_id
        tests:
          - not_null
      - name: transaction_date
        tests:
          - not_null

  - name: stg_transaction_items
    columns:
      - name: tenant_id
        tests:
          - not_null
      - name: item_id
        tests:
          - not_null

  - name: fact_sales
    columns:
      - name: sales_key
        tests:
          - not_null
          - unique
      - name: tenant_id
        tests:
          - not_null

  - name: fact_promotion_usage
    columns:
      - name: promotion_usage_key
        tests:
          - not_null
          - unique