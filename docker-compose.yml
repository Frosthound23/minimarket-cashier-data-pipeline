  dbt:
    build:
      context: ./dbt
      dockerfile: Dockerfile
    image: minimarket_dbt:latest
    container_name: minimarket_dbt
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./dbt/minimarket_dbt:/app
      - ./init-scripts/dbt:/app/scripts
    networks:
      - minimarket_network
    depends_on:
      clickhouse:
        condition: service_healthy
      pipeline:
        condition: service_started
    # command: sh /app/scripts/init_dbt.sh



