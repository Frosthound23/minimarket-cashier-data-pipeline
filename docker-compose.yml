x-airflow-common: &airflow-common
  build:
    context: ./airflow
  env_file:
    - .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@${AIRFLOW_POSTGRES_HOST}:${AIRFLOW_POSTGRES_PORT}/${AIRFLOW_POSTGRES_DB}"
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_WEBSERVER_SECRET_KEY}"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - /var/run/docker.sock:/var/run/docker.sock
  networks:
    - minimarket_network

services:
  postgres:
    image: postgres:16
    container_name: minimarket_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/postgres/init_postgres.sql:/docker-entrypoint-initdb.d/init_postgres.sql
      - ./init-scripts/postgres/seed_data.sql:/docker-entrypoint-initdb.d/seed_data.sql
    networks:
      - minimarket_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: minimarket_clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./init-scripts/clickhouse/init_clickhouse.sql:/docker-entrypoint-initdb.d/init_clickhouse.sql
    networks:
      - minimarket_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  jupyter:
    image: jupyter/scipy-notebook:latest
    container_name: minimarket_jupyter
    ports:
      - "8888:8888"
    env_file:
      - .env
    volumes:
      - ./notebooks:/home/jovyan/work
    networks:
      - minimarket_network
    depends_on:
      - clickhouse

  superset:
    build:
      context: ./superset
      dockerfile: Dockerfile
    image: minimarket_superset:latest
    container_name: minimarket_superset
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "superset"
      SUPERSET_LOAD_EXAMPLES: "no"
    volumes:
      - superset_home:/app/superset_home
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
    networks:
      - minimarket_network
    depends_on:
      - clickhouse
    command: >
      /bin/sh -c "
      superset db upgrade &&
      superset fab create-admin --username admin --firstname Superset --lastname Admin --email admin@example.com --password admin || true &&
      superset init &&
      superset run -h 0.0.0.0 -p 8088
      "

  # pipeline:
  #   build:
  #     context: ./pipeline
  #   image: minimarket_pipeline:latest
  #   container_name: minimarket_pipeline
  #   env_file:
  #     - .env
  #   volumes:
  #     - ./pipeline:/app
  #   depends_on:
  #     clickhouse:
  #       condition: service_healthy
  #     postgres:
  #       condition: service_started
  #   networks:
  #     - minimarket_network

  pipeline-python:
    build:
      context: ./pipeline/python
    image: minimarket_pipeline_python:latest
    container_name: minimarket_pipeline_python
    env_file:
      - .env
    networks:
      - minimarket_network
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy

  pipeline-go:
    build:
      context: ./pipeline/go
    image: minimarket_pipeline_go:latest
    container_name: minimarket_pipeline_go
    env_file:
      - .env
    networks:
      - minimarket_network
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy

  airflow-init:
    <<: *airflow-common
    container_name: minimarket_airflow_init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username admin --firstname Airflow --lastname Admin --role Admin --email admin@example.com --password admin || true"

  airflow-webserver:
    <<: *airflow-common
    container_name: minimarket_airflow_webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: webserver

  airflow-scheduler:
    <<: *airflow-common
    container_name: minimarket_airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

  airflow-postgres:
    image: postgres:16
    container_name: minimarket_airflow_postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB}
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    networks:
      - minimarket_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_POSTGRES_USER} -d ${AIRFLOW_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  dbt:
    build:
      context: ./dbt
      dockerfile: Dockerfile
    image: minimarket_dbt:latest
    container_name: minimarket_dbt
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./dbt/minimarket_dbt:/app
      - ./init-scripts/dbt:/app/scripts
    networks:
      - minimarket_network
    depends_on:
      clickhouse:
        condition: service_healthy
    # command: sh /app/scripts/init_dbt.sh

  analytics_api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: minimarket_analytics_api:latest
    container_name: minimarket_analytics_api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - minimarket_network
    depends_on:
      - clickhouse

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: minimarket_dashboard:latest
    container_name: minimarket_dashboard
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - minimarket_network
    depends_on:
      - analytics_api


networks:
  minimarket_network:
    name: ${MINIMARKET_NETWORK_NAME}
    driver: bridge

volumes:
  postgres_data:
  clickhouse_data:
  superset_home:
  airflow_postgres_data:
